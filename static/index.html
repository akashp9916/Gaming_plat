<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudPlay - Play without installing</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--panel:#0a0e18;--p2:#121a2b;--line:#222c42;--text:#eaf0ff;--mute:#8a96b2;--p:#8b5cff;--c:#00e5ff;--g:#00ffa3;--pk:#ff3d9a;--bad:#ff4d6d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:600 16px/1.45 Rajdhani,system-ui,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(650px 420px at 88% -6%,#8b5cff44,transparent),radial-gradient(520px 420px at -6% 62%,#00e5ff22,transparent),radial-gradient(520px 420px at 62% 112%,#ff3d9a22,transparent)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0,#000 15%,transparent 75%)}
h1,h2,h3,h4,.logo,.cta,.kick{font-family:Orbitron,Rajdhani,sans-serif}
#shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:#0a0e18d9;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:4px}
.logo{font-size:21px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--c),var(--p),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 10px 20px}
#nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nv{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;border:0;background:none;color:var(--mute);cursor:pointer;font:inherit;font-size:17px;text-align:left;width:100%;transition:.2s}
.nv em{font-style:normal}
.nv:hover{color:#fff;background:#ffffff0d}
.nv.on{color:#fff;background:linear-gradient(90deg,#8b5cff44,transparent);box-shadow:inset 3px 0 var(--p)}
.mainc{min-width:0}
.top{display:flex;gap:14px;align-items:center;padding:14px 28px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);background:#07090fbf;border-bottom:1px solid var(--line)}
.sr{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.sr input{flex:1;background:none;border:0;color:var(--text);padding:11px 0;font:inherit;outline:0}
.sr:focus-within{border-color:var(--c);box-shadow:0 0 18px #00e5ff33}
.uchip{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:900 16px Orbitron,sans-serif;background:linear-gradient(135deg,var(--p),var(--c));box-shadow:0 0 16px #8b5cff66}
.av.big{width:92px;height:92px;font-size:38px;box-shadow:0 0 0 4px #07090f,0 0 0 6px var(--c),0 0 36px #00e5ff66}
main{padding:26px 28px 60px;max-width:1300px}
.guest #shell{display:block}.guest aside,.guest .top{display:none}.guest main{max-width:none;padding:0}
.sh{font-size:20px;letter-spacing:1px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.sh a{margin-left:auto;font:600 14px Rajdhani;color:var(--c);cursor:pointer}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:310px;padding:38px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;border:1px solid var(--line);box-shadow:0 0 50px #8b5cff30;animation:fade .6s}
.bgart{position:absolute;inset:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07090ff0 12%,#07090f55 65%,transparent),linear-gradient(0deg,#07090fb0,transparent 55%)}
.hero>*{position:relative;z-index:1}.hero>.bgart{position:absolute;z-index:0}
.hero .em{position:absolute;right:7%;top:50%;transform:translateY(-50%);font-size:150px;z-index:1;animation:emf 5s ease-in-out infinite;filter:drop-shadow(0 0 40px #8b5cff)}
.hero h1{margin:0;font-size:clamp(26px,4vw,46px);font-weight:900;letter-spacing:1px;max-width:600px;text-shadow:0 0 30px #8b5cff88}
.hero p{margin:0;max-width:520px;color:#c9d3f0}
.kick{font-size:12px;letter-spacing:3px;color:var(--g)}
.acts{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dots i{width:26px;height:4px;border-radius:4px;background:#ffffff2a;cursor:pointer;transition:.3s}.dots i.on{background:var(--c);box-shadow:0 0 10px var(--c);width:44px}
.cta{background:linear-gradient(90deg,var(--p),var(--c));color:#fff;border:0;padding:12px 26px;border-radius:12px;font-weight:700;font-size:13px;letter-spacing:1.5px;cursor:pointer;box-shadow:0 0 24px #8b5cff66;transition:.2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 36px #00e5ff88}.cta:disabled{opacity:.6;cursor:wait}
.cta.sm{padding:8px;font-size:11px;width:100%}
.b2{background:#ffffff12;border:1px solid #ffffff24;color:var(--text);padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block;transition:.2s}
.b2:hover{background:#ffffff22}.b2.red{background:#ff4d6d30;border-color:var(--bad);color:#ff9fb0}
.rowh{display:flex;gap:16px;overflow-x:auto;padding:8px 4px 18px;scroll-snap-type:x proximity}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.gc{position:relative;flex:0 0 200px;background:var(--p2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.25s;scroll-snap-align:start;animation:fade .5s}
.grid .gc{flex:none}
.gc:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 14px 36px #00e5ff30}
.cv{height:132px;display:grid;place-items:center;position:relative;overflow:hidden}
.cv::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,#ffffff33,transparent 55%)}
.cv span{font-size:56px;position:relative;filter:drop-shadow(0 8px 14px #0009);transition:.3s}
.gc:hover .cv span{transform:scale(1.18) rotate(-6deg)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rk{position:absolute;left:10px;bottom:-4px;font:900 46px Orbitron,sans-serif;color:#0000;-webkit-text-stroke:2px #fffd;text-shadow:0 0 20px #8b5cff}
.nw{position:absolute;right:8px;top:8px;background:var(--g);color:#012;font:900 10px Orbitron,sans-serif;padding:3px 7px;border-radius:6px;font-style:normal}
.gi{padding:12px 12px 2px}.gi h4{margin:0 0 5px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tg{background:#ffffff12;border:1px solid #ffffff1c;border-radius:99px;padding:0 9px;font-size:12px;color:#cfd8ff}
.gc .cta{margin:10px 12px 12px;width:calc(100% - 24px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{background:var(--p2);border:1px solid var(--line);color:var(--mute);padding:6px 16px;border-radius:99px;cursor:pointer;font:inherit;transition:.2s}
.chip:hover{color:#fff}.chip.on{background:linear-gradient(90deg,var(--p),var(--c));color:#fff;border-color:transparent;box-shadow:0 0 16px #8b5cff66}
.card{background:#0f1626cc;border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(6px)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;margin-bottom:18px;border-radius:14px;border:1px solid var(--g);background:#00ffa31a;box-shadow:0 0 24px #00ffa322}
.banner span{flex:1}
.prof{display:flex;gap:24px;align-items:center;padding:28px;flex-wrap:wrap}
.pi{flex:1;min-width:240px}.pi h2{margin:0 0 6px;font-size:26px}
.badge{display:inline-block;background:linear-gradient(90deg,var(--p),var(--pk));font:700 11px Orbitron,sans-serif;padding:4px 10px;border-radius:99px;letter-spacing:1px;margin-right:6px}.badge.adm{background:var(--g);color:#012}
.xp{height:10px;border-radius:9px;background:#ffffff14;margin:14px 0 6px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--g));box-shadow:0 0 14px var(--c);border-radius:9px;transition:width .8s}
.st4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.st4>div{padding:18px;text-align:center}.st4 b{display:block;font:900 24px Orbitron,sans-serif;color:var(--c);margin-bottom:2px}.st4 small{color:var(--mute)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ach>div{padding:14px;display:flex;gap:12px;align-items:center;opacity:.35;filter:grayscale(1)}.ach>div.on{opacity:1;filter:none;border-color:var(--g);box-shadow:0 0 18px #00ffa322}.ach span{font-size:28px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:13px;letter-spacing:1px}
.stage{display:flex;flex-direction:column;height:calc(100vh - 130px);min-height:420px;animation:fade .5s}
.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;margin-bottom:12px;border-radius:14px;background:#0f1626e6;border:1px solid var(--line)}
.hud h3{margin:0;font-size:15px;flex:1}.live{color:var(--bad);font-size:12px;animation:bl 1.4s infinite;margin-right:8px}
.tm{font:700 15px Orbitron,sans-serif;color:var(--g)}
.pw{font-family:ui-monospace,monospace;background:#000;padding:3px 9px;border-radius:6px;border:1px solid var(--line);font-size:13px}
.screen{flex:1;border-radius:16px;overflow:hidden;border:2px solid var(--p);box-shadow:0 0 0 1px #00e5ff55,0 0 60px #8b5cff55;background:#000}
.screen iframe{width:100%;height:100%;border:0;display:block}
dialog{background:#0c1220;color:var(--text);border:1px solid var(--line);border-radius:18px;width:min(560px,94vw);padding:0;box-shadow:0 0 70px #8b5cff55;font:inherit}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
.dh{height:170px;display:grid;place-items:center;position:relative}.dh span{font-size:84px;filter:drop-shadow(0 10px 20px #0009)}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer;font-size:16px}
.db{padding:22px 24px 26px}.db h2{margin:0 0 8px;font-size:24px}.db p{color:#c3cde8;margin:12px 0}
.ds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 20px}.ds div{background:var(--p2);border-radius:12px;padding:10px;text-align:center}.ds b{display:block;font:700 15px Orbitron,sans-serif;color:var(--c)}.ds small{color:var(--mute);font-size:12px}
.fm{padding:24px}.fm h3{margin:0 0 6px}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:14px}
input,textarea{width:100%;background:#070b14;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font:inherit}
input:focus,textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 14px #00e5ff33}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.err{color:var(--bad);min-height:22px;margin-top:8px}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative}
.auth .card{width:min(400px,100%);padding:32px;box-shadow:0 0 60px #8b5cff40}
.auth h2{font-size:24px;margin:0 0 6px}.auth .logo{padding:0 0 16px;font-size:26px;text-align:center}
.fl{display:flex;justify-content:center;gap:18px;font-size:34px;margin-bottom:12px}.fl span{animation:fl 3s ease-in-out infinite}.fl span:nth-child(2){animation-delay:.5s}.fl span:nth-child(3){animation-delay:1s}.fl span:nth-child(4){animation-delay:1.5s}
.toast{position:fixed;bottom:22px;right:22px;background:#0f1626;border:1px solid var(--c);box-shadow:0 0 24px #00e5ff44;padding:12px 18px;border-radius:12px;display:none;z-index:50}
.empty{color:var(--mute);text-align:center;padding:60px 0;grid-column:1/-1}
@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes emf{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 14px))}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes bl{50%{opacity:.3}}
@media(max-width:820px){#shell{grid-template-columns:62px 1fr}aside{padding:14px 6px}aside .logo,.nv em{display:none}.nv{justify-content:center;padding:12px 0}main{padding:18px 14px 50px}.top{padding:12px 14px}.hero{padding:22px}.hero .em{font-size:80px;opacity:.5}.ds{grid-template-columns:repeat(2,1fr)}.uchip span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell">
  <aside><div class="logo">CLOUDPLAY</div><nav id="nav"></nav>
    <button class="nv" id="out"><span>⏻</span><em>Logout</em></button></aside>
  <div class="mainc">
    <div class="top"><div class="sr"><span>🔍</span><input id="gs" placeholder="Search games..."></div><div class="uchip" id="uchip"></div></div>
    <main id="app"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<dialog id="gd"></dialog>
<dialog id="dlg"><form id="gform" class="fm">
  <h3>Add game</h3>
  <div class="row2"><div><label>Title</label><input name="title" required></div>
  <div><label>Slug (folder in /data/games)</label><input name="slug" required pattern="[a-z0-9\-_]+"></div></div>
  <label>Streaming Docker image</label><input name="docker_image" required placeholder="your-selkies-image:latest">
  <label>Executable</label><input name="executable" required placeholder="bin/game.exe">
  <div class="row2"><div><label>Genres (comma separated)</label><input name="genre" placeholder="racing, action"></div>
  <div><label>Size (GB)</label><input name="size_gb" type="number" step="0.1" value="0"></div></div>
  <label>Cover image URL (optional)</label><input name="cover_url">
  <label>Description</label><textarea name="description" rows="2"></textarea>
  <div class="err" id="gerr"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button type="button" class="b2" id="gcancel">Cancel</button><button class="cta">SAVE GAME</button></div>
</form></dialog>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('cp_token'),user=null,view='home',games=[],q='',chip='',hb=null,tmT=null,heroT=null;

async function api(path,o={}){
  const r=await fetch(path,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:o.body?JSON.stringify(o.body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&token)logout();throw new Error(typeof d.detail==='string'?d.detail:'Request failed')}
  return d;
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3800)}
function logout(){localStorage.removeItem('cp_token');token=null;user=null;clearInterval(hb);clearInterval(tmT);clearInterval(heroT);boot()}
$('#out').onclick=logout;
const fmt=s=>s==null?'-':s<60?Math.round(s)+' s':s<3600?Math.round(s/60)+' min':(s/3600).toFixed(1)+' h';
const when=d=>new Date(d+'Z');

/* ---------- visuals ---------- */
const hueOf=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%360;
const art=g=>{const h=hueOf(g.title);return `linear-gradient(135deg,hsl(${h} 80% 40%),hsl(${(h+70)%360} 85% 20%))`};
const EMO={racing:'🏎️',rpg:'🐉',fantasy:'🐉',shooter:'🔫','sci-fi':'🚀',casual:'🌾',simulation:'🌾',action:'⚔️',adventure:'🗺️',horror:'👻',sports:'⚽',puzzle:'🧩',strategy:'♟️',fighting:'🥊','open world':'🌍'};
const emo=g=>{for(const x of g.genre||[])if(EMO[x.toLowerCase()])return EMO[x.toLowerCase()];return '🎮'};
const tags=g=>(g.genre||[]).slice(0,3).map(x=>`<span class="tg">${esc(x)}</span>`).join('');
const isNew=g=>g.created_at&&(Date.now()-when(g.created_at))<14*864e5;
const popular=()=>[...games].sort((a,b)=>b.play_count-a.play_count);
const newest=()=>[...games].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
const filtered=()=>games.filter(g=>(!chip||(g.genre||[]).includes(chip))&&(!q||g.title.toLowerCase().includes(q.toLowerCase())));
const card=(g,rank)=>`<div class="gc" data-id="${esc(g.id)}"><div class="cv" style="background:${art(g)}">${g.cover_url?`<img src="${esc(g.cover_url)}" alt="">`:`<span>${emo(g)}</span>`}${rank?`<b class="rk">${rank}</b>`:''}${isNew(g)?'<i class="nw">NEW</i>':''}</div>
<div class="gi"><h4>${esc(g.title)}</h4><div class="mt">${tags(g)}</div><div class="mt" style="margin-top:4px">${g.size_gb} GB · 🔥 ${g.play_count}</div></div>
<button class="cta sm" data-play="${esc(g.id)}">▶ PLAY</button></div>`;
const row=(l,r)=>`<div class="rowh">${l.map((g,i)=>card(g,r?i+1:0)).join('')}</div>`;
const chips=()=>{const gs=[...new Set(games.flatMap(g=>g.genre||[]))];return '<div class="chips">'+['',...gs].map(x=>`<button class="chip ${x===chip?'on':''}" data-chip="${esc(x)}">${x?esc(x):'All'}</button>`).join('')+'</div>'};
const shell=h=>$('#app').innerHTML='<div id="banner"></div>'+h;

/* ---------- navigation ---------- */
const NAV=[['home','🏠','Home'],['popular','🔥','Popular'],['new','✨','New releases'],['library','🎮','All games'],['profile','👤','My profile'],['history','🕑','History']];
function setNav(){
  document.body.classList.toggle('guest',!user);
  if(!user)return;
  $('#nav').innerHTML=NAV.concat(user.role==='admin'?[['add','➕','Add game']]:[]).map(([k,i,l])=>`<button class="nv ${k===view?'on':''}" data-nav="${k}"><span>${i}</span><em>${l}</em></button>`).join('');
  $$('[data-nav]').forEach(b=>b.onclick=()=>b.dataset.nav==='add'?$('#dlg').showModal():go(b.dataset.nav));
  $('#uchip').innerHTML=`<span>${esc(user.username)}</span><div class="av">${esc(user.username[0].toUpperCase())}</div>`;
  $('#uchip').onclick=()=>go('profile');
}
async function go(v){
  view=v;clearInterval(heroT);clearInterval(tmT);setNav();scrollTo(0,0);
  try{games=await api('/games?limit=100');await VIEWS[v]();bind();banner()}catch(e){toast(e.message)}
}
function bind(){
  $$('[data-play]').forEach(b=>b.onclick=e=>{e.stopPropagation();start(b.dataset.play,b)});
  $$('[data-info]').forEach(b=>b.onclick=e=>{e.stopPropagation();detail(b.dataset.info)});
  $$('.gc').forEach(c=>c.onclick=()=>detail(c.dataset.id));
  $$('[data-chip]').forEach(b=>b.onclick=()=>{chip=b.dataset.chip;go(view)});
  $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}
$('#gs').oninput=e=>{q=e.target.value;if(user)go('library')};

/* ---------- views ---------- */
const empty=()=>`<div class="empty">No games yet.${user.role==='admin'?' Use “Add game” in the sidebar.':''}</div>`;
const heroHTML=g=>`<div class="bgart" style="background:${art(g)}"></div><div class="em">${emo(g)}</div>
<small class="kick">${isNew(g)?'✨ NEW RELEASE':'🔥 TRENDING NOW'}</small><h1>${esc(g.title)}</h1><p>${esc(g.description)}</p>
<div class="mt">${tags(g)} <span>${g.size_gb} GB</span></div>
<div class="acts"><button class="cta" data-play="${esc(g.id)}">▶ PLAY NOW</button><button class="b2" data-info="${esc(g.id)}">ℹ Game profile</button></div>`;
const VIEWS={
  async home(){
    if(!games.length)return shell(empty());
    const feat=[...new Map([...popular().slice(0,3),...newest().slice(0,2)].map(g=>[g.id,g])).values()];
    shell(`<section class="hero" id="hero"></section><div class="dots" id="dots">${feat.map((_,i)=>`<i data-d="${i}"></i>`).join('')}</div>
      <h2 class="sh">🔥 Popular right now <a data-go="popular">See all →</a></h2>${row(popular().slice(0,8),1)}
      <h2 class="sh">✨ New releases <a data-go="new">See all →</a></h2>${row(newest().slice(0,8))}
      <h2 class="sh">🎮 Browse all</h2>${chips()}<div class="grid">${filtered().map(g=>card(g)).join('')||empty()}</div>`);
    let hi=0;const show=i=>{hi=i;$('#hero').innerHTML=heroHTML(feat[i]);$$('#dots i').forEach((d,j)=>d.classList.toggle('on',j===i));bind()};
    $$('#dots i').forEach(d=>d.onclick=()=>{show(+d.dataset.d);clearInterval(heroT)});
    show(0);heroT=setInterval(()=>show((hi+1)%feat.length),6500);
  },
  async popular(){shell(`<h2 class="sh">🔥 Most played</h2><div class="grid">${popular().map((g,i)=>card(g,i+1)).join('')||empty()}</div>`)},
  async new(){shell(`<h2 class="sh">✨ New releases</h2><div class="grid">${newest().map(g=>card(g)).join('')||empty()}</div>`)},
  async library(){shell(`<h2 class="sh">🎮 All games ${q?`<span class="mt">— “${esc(q)}”</span>`:''}</h2>${chips()}<div class="grid">${filtered().map(g=>card(g)).join('')||empty()}</div>`)},
  async history(){
    const rows=await api('/sessions/history?limit=100').catch(()=>[]);
    shell(`<h2 class="sh">🕑 Play history</h2><div class="card"><table><tr><th>GAME</th><th>STARTED</th><th>DURATION</th><th>STATUS</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.game_title)}</td><td>${when(r.started_at).toLocaleString()}</td><td>${fmt(r.duration_seconds)}</td><td>${esc(r.end_reason||r.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nothing played yet. Go play something!</td></tr>'}</table></div>`);
  },
  async profile(){
    user=await api('/me');setNav();
    const h=await api('/sessions/history?limit=100').catch(()=>[]);
    const mins=Math.floor(user.total_playtime_seconds/60),lvl=1+Math.floor(mins/30),pct=(mins%30)/30*100;
    const cnt={};h.forEach(x=>cnt[x.game_title]=(cnt[x.game_title]||0)+1);
    const fav=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0],uniq=Object.keys(cnt).length;
    const rank=['Rookie','Gamer','Pro','Elite','Legend'][Math.min(4,Math.floor(lvl/3))];
    const ach=[['🎯','First play',h.length>=1],['🧭','Explorer: 3 games',uniq>=3],['⏱️','Marathon: 2 hours',mins>=120],['🏆','Veteran: 10 sessions',h.length>=10],['👑','Legend: level 12',lvl>=12]];
    shell(`<div class="card prof"><div class="av big">${esc(user.username[0].toUpperCase())}</div><div class="pi"><h2>${esc(user.username)}</h2>
      <span class="badge">${rank} · LVL ${lvl}</span>${user.role==='admin'?'<span class="badge adm">ADMIN</span>':''}
      <div class="xp"><i style="width:${pct}%"></i></div><small class="mt">${mins%30}/30 min to level ${lvl+1} · Member since ${when(user.created_at).toLocaleDateString()}</small></div></div>
      <div class="st4"><div class="card"><b>${fmt(user.total_playtime_seconds)}</b><small>Total playtime</small></div><div class="card"><b>${h.length}</b><small>Sessions</small></div>
      <div class="card"><b>${uniq}</b><small>Games tried</small></div><div class="card"><b style="font-size:15px">${fav?esc(fav[0]):'-'}</b><small>Favorite game</small></div></div>
      <h2 class="sh">🏅 Achievements</h2><div class="ach">${ach.map(([i,t,on])=>`<div class="card ${on?'on':''}"><span>${i}</span><b>${t}</b></div>`).join('')}</div>
      <h2 class="sh">🕑 Recent activity</h2><div class="card"><table>${h.slice(0,5).map(r=>`<tr><td>${esc(r.game_title)}</td><td>${when(r.started_at).toLocaleString()}</td><td>${fmt(r.duration_seconds)}</td></tr>`).join('')||'<tr><td class="empty">No activity yet.</td></tr>'}</table></div>`);
  }
};

/* ---------- game profile dialog ---------- */
function detail(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  const rank=popular().findIndex(x=>x.id===id)+1;
  $('#gd').innerHTML=`<div class="dh" style="background:${art(g)}">${g.cover_url?`<img src="${esc(g.cover_url)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="">`:`<span>${emo(g)}</span>`}<button class="x" id="gdx">✕</button></div>
    <div class="db"><h2>${esc(g.title)}</h2><div class="mt">${tags(g)}${isNew(g)?'<span class="tg" style="color:var(--g)">NEW</span>':''}</div>
    <p>${esc(g.description||'No description yet.')}</p>
    <div class="ds"><div><b>${g.size_gb} GB</b><small>Game size</small></div><div><b>${g.play_count}</b><small>Plays</small></div><div><b>${esc(g.resolution||'1080p')}</b><small>Stream</small></div><div><b>#${rank}</b><small>Popularity</small></div></div>
    <div class="acts"><button class="cta" id="gdp">▶ PLAY NOW</button>${user.role==='admin'?'<button class="b2 red" id="gdd">Delete game</button>':''}</div></div>`;
  $('#gd').showModal();
  $('#gdx').onclick=()=>$('#gd').close();
  $('#gdp').onclick=()=>{$('#gd').close();start(id)};
  if($('#gdd'))$('#gdd').onclick=async()=>{if(confirm('Delete this game?')){await api('/games/'+id,{method:'DELETE'});$('#gd').close();go(view)}};
}

/* ---------- play ---------- */
async function start(id,btn){
  const g=games.find(x=>x.id===id);if(btn){btn.disabled=true;btn.textContent='STARTING…'}
  try{const s=await api('/sessions/start/'+id,{method:'POST'});playView({...s,game_title:g?g.title:'Game'})}
  catch(e){toast(e.message);if(btn){btn.disabled=false;btn.textContent='▶ PLAY'}}
}
function playView(s){
  view='play';setNav();clearInterval(heroT);clearInterval(tmT);clearInterval(hb);scrollTo(0,0);
  shell(`<div class="stage"><div class="hud"><span class="live">● LIVE</span><h3>${esc(s.game_title)}</h3><span class="tm" id="tm">00:00</span>
    <span class="mt">Password</span><span class="pw">${esc(s.stream_password)}</span>
    <button class="b2" id="fs">⛶ Fullscreen</button><a class="b2" href="${esc(s.stream_url)}" target="_blank" rel="noopener">↗ New tab</a><button class="b2 red" id="stop">■ Stop</button></div>
    <div class="screen"><iframe src="${esc(s.stream_url)}" allow="fullscreen; gamepad; microphone; autoplay; clipboard-read; clipboard-write"></iframe></div></div>`);
  const t0=Date.now();tmT=setInterval(()=>{const e=$('#tm');if(!e)return;const n=Math.floor((Date.now()-t0)/1e3);e.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')},1000);
  hb=setInterval(()=>api(`/sessions/${s.session_id}/heartbeat`,{method:'POST'}).catch(()=>{clearInterval(hb);toast('Session ended');go('home')}),20000);
  $('#fs').onclick=()=>$('.screen').requestFullscreen&&$('.screen').requestFullscreen();
  $('#stop').onclick=async()=>{clearInterval(hb);clearInterval(tmT);await api(`/sessions/${s.session_id}/stop`,{method:'POST'}).catch(()=>{});go('home')};
}
async function banner(){
  if(view==='play'||!$('#banner'))return;
  try{
    const a=await api('/sessions/active');if(!a.active||!$('#banner'))return;
    $('#banner').innerHTML=`<div class="banner"><span>🟢 Still playing: <b>${esc(a.game_title)}</b></span><button class="cta sm" style="width:auto;padding:8px 18px" id="rs">RESUME</button><button class="b2 red" id="sp">Stop</button></div>`;
    $('#rs').onclick=()=>playView(a);
    $('#sp').onclick=async()=>{clearInterval(hb);await api(`/sessions/${a.session_id}/stop`,{method:'POST'}).catch(()=>{});go(view)};
    if(!hb)hb=setInterval(()=>api(`/sessions/${a.session_id}/heartbeat`,{method:'POST'}).catch(()=>{}),20000);
  }catch(e){}
}

/* ---------- add game ---------- */
$('#gcancel').onclick=()=>$('#dlg').close();
$('#gform').onsubmit=async e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  f.genre=f.genre.split(',').map(x=>x.trim()).filter(Boolean);f.size_gb=parseFloat(f.size_gb)||0;
  try{await api('/games',{method:'POST',body:f});$('#dlg').close();e.target.reset();toast('Game added ✔');go('home')}
  catch(er){$('#gerr').textContent=er.message}
};

/* ---------- auth + boot ---------- */
function authView(mode='login'){
  const reg=mode==='register';
  $('#app').innerHTML=`<div class="auth"><div class="card"><div class="fl"><span>🏎️</span><span>🐉</span><span>🚀</span><span>🎮</span></div><div class="logo">CLOUDPLAY</div>
    <h2>${reg?'Create account':'Welcome back, player'}</h2><div class="mt">Play big games in your browser. Nothing to install.</div>
    <form id="af">${reg?'<label>Username</label><input name="username" required minlength="3">':''}
    <label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required minlength="8">
    <div class="err" id="aerr"></div><button class="cta" style="width:100%">${reg?'REGISTER':'LOGIN'}</button></form>
    <p class="mt" style="justify-content:center;margin-top:16px">${reg?'Have an account?':'New here?'} <a href="#" id="sw" style="color:var(--c)">${reg?'Login':'Register'}</a></p></div></div>`;
  $('#sw').onclick=e=>{e.preventDefault();authView(reg?'login':'register')};
  $('#af').onsubmit=async e=>{
    e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    try{if(reg)await api('/auth/register',{method:'POST',body:f});
      const t=await api('/auth/login',{method:'POST',body:{email:f.email,password:f.password}});
      token=t.access_token;localStorage.setItem('cp_token',token);boot()}
    catch(er){$('#aerr').textContent=er.message}
  };
}
async function boot(){
  if(!token){user=null;setNav();return authView()}
  try{user=await api('/me');q='';chip='';go('home')}catch(e){authView()}
}
boot();
</script>
</body>
</html>
